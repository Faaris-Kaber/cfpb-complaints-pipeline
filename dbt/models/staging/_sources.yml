version: 2

sources:
  - name: cfpb
    description: Raw CFPB complaints landed by COPY INTO from S3 (one VARIANT per complaint version).
    database: RAW
    schema: CFPB
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: complaints
        description: >
          Append-only. The same complaint_id appears many times because every
          daily run re-pulls a 30-day lookback window. Deduplicated in staging.
        columns:
          - name: record
            description: Complaint JSON as returned by the API (or mapped from the bulk CSV).
          - name: _file
            description: S3 object the row came from.
          - name: _loaded_at
            description: When COPY INTO loaded the row.
