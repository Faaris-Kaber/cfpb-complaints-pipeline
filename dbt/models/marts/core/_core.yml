version: 2

models:
  - name: fct_complaints
    description: >
      Complaint fact table (star schema center). One row per complaint, with
      foreign keys to every dimension, resolution flags and timing measures.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_cfpb__complaints')
    columns:
      - name: complaint_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: date_received_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: issue_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_issue')
                field: issue_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submission_channel')
                field: channel_key
      - name: resolution_category
        data_tests:
          - accepted_values:
              arguments:
                values: [relief, explanation, closed_no_relief, untimely, in_progress, unknown]
      - name: days_to_close_observed
        description: >
          Days from receipt to the first snapshot showing the complaint closed.
          Only available for complaints the pipeline saw "In progress".
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "days_to_close_observed is not null"

  - name: dim_date
    description: Calendar day dimension from Dec 2011 to one year ahead.
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_company
    description: Parent company dimension (legal entities rolled up via the company_reference seed).
    columns:
      - name: company_key
        data_tests: [unique, not_null]
      - name: parent_company
        data_tests: [unique, not_null]

  - name: dim_product
    description: Product / sub-product, with a product_group that is stable across CFPB taxonomy changes.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_group
        data_tests: [not_null]

  - name: dim_issue
    columns:
      - name: issue_key
        data_tests: [unique, not_null]

  - name: dim_geography
    columns:
      - name: geography_key
        data_tests: [unique, not_null]

  - name: dim_submission_channel
    columns:
      - name: channel_key
        data_tests: [unique, not_null]
