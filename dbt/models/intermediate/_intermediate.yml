version: 2

models:
  - name: int_companies__normalized
    description: Distinct raw company names mapped to parent brand and company type.
    columns:
      - name: company
        data_tests: [unique, not_null]
      - name: parent_company
        description: Parent brand; falls back to the raw name when unmapped.
        data_tests: [not_null]

  - name: int_complaints__resolution_dates
    description: >
      Observed close date per complaint, derived from the status snapshot. Only
      complaints seen "In progress" by the pipeline are included.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: observed_closed_on
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= first_open_on"
              config:
                where: "observed_closed_on is not null"

  - name: int_complaints__enriched
    description: Deduplicated complaints joined to company and resolution data.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: resolution_category
        data_tests:
          - accepted_values:
              arguments:
                values: [relief, explanation, closed_no_relief, untimely, in_progress, unknown]
      - name: days_to_forward
        description: Days from CFPB receiving the complaint to forwarding it to the company.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 365
              config:
                severity: warn
                where: "days_to_forward is not null"
