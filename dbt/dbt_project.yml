name: cfpb
version: "1.0.0"
config-version: 2
profile: cfpb

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
# Defaults are target/ and dbt_packages/. The Airflow container overrides them with
# DBT_TARGET_PATH / DBT_PACKAGES_INSTALL_PATH so it never shares these folders with
# the host through the project bind mount.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets: ["target", "dbt_packages"]

vars:
  # First date in dim_date (CFPB complaints start in Dec 2011).
  date_spine_start: "2011-12-01"

models:
  cfpb:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      reporting:
        +schema: reporting

seeds:
  cfpb:
    +schema: seeds

snapshots:
  cfpb:
    +schema: snapshots
